name: backend-ci

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/db/**"
      - "packages/cli/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/db/**"
      - "packages/cli/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanstro
          POSTGRES_PASSWORD: vanstro
          POSTGRES_DB: vanstro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanstro -d vanstro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vanstro:vanstro@localhost:5432/vanstro_test
      PAYMENT_CALLBACK_SECRET: ci-payment-secret
      ERP_WEBHOOK_SECRET: ci-erp-webhook-secret
      VANSTRO_RUNTIME_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @vanstro/db exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm db:seed
      - run: pnpm qa:backend
