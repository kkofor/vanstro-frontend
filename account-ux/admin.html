<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops · VANSTRO</title>
<link rel="stylesheet" href="/account/assets/vi.css">
<style>
  :root { --side: 232px; }
  html, body { margin: 0; background: var(--vs-grey-50); color: var(--vs-text); }
  a { color: var(--vs-navy); }
  .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }

  /* ---- sidebar ---- */
  .side { background: var(--vs-navy-900); color: #fff; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; }
  .side__brand { display: grid; gap: 10px; padding: 18px 18px 14px; color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.08); }
  .side__brand img { height: 26px; width: auto; justify-self: start; }
  .side__brand strong { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; display: block; }
  .side__brand span { display: block; color: rgba(255,255,255,.5); font-size: 11.5px; font-weight: 500; margin-top: 2px; }
  .side nav { padding: 12px 10px; display: grid; gap: 2px; flex: 1; }
  .side .grp { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.42); padding: 14px 10px 6px; font-weight: 700; }
  .side nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: rgba(255,255,255,.76); padding: 8px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600; text-decoration: none; }
  .side nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
  .side nav a.is-on { background: rgba(255,255,255,.14); color: #fff; }
  .side nav a .n { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-variant-numeric: tabular-nums; }
  .side nav a .n.warn { background: var(--vs-orange); color: #1b1200; }
  .side nav a .n.bad { background: #e0574d; }
  .side__foot { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; color: rgba(255,255,255,.6); display: grid; gap: 8px; }
  .side__foot .btn { color: #fff; justify-self: start; }

  /* ---- main ---- */
  .main { min-width: 0; padding: 22px 32px 80px; display: grid; gap: 18px; align-content: start; max-width: 1480px; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .topbar .sub { margin: 4px 0 0; color: var(--vs-text-3); font-size: 13.5px; }
  .topbar .crumbs { margin: 0 0 4px; font-size: 12.5px; color: var(--vs-text-3); }
  .topbar .right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: #fff; border: 1px solid var(--vs-grey-200); border-radius: 8px; padding: 3px; }
  .seg button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--vs-text-2); cursor: pointer; }
  .seg button.is-on { background: var(--vs-navy); color: #fff; }
  .jump { min-width: 260px; height: 38px; }
  .control { height: 40px; }
  textarea.control { height: auto; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
  .kpi { background: #fff; border: 1px solid var(--vs-grey-100); border-radius: var(--vs-r-lg); padding: 14px 16px; text-align: left; color: inherit; text-decoration: none; display: block; width: 100%; min-width: 0; }
  button.kpi { cursor: pointer; font: inherit; }
  button.kpi:hover, a.kpi:hover { border-color: var(--vs-navy); }
  .kpi em { display: block; font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--vs-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi b { display: block; font-size: 24px; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
  .kpi small { display: block; color: var(--vs-text-3); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi.warn b { color: var(--vs-orange-ink); }
  .kpi.bad b { color: var(--vs-error); }

  .row { display: grid; gap: 16px; align-items: start; }
  .row--2 { grid-template-columns: 1fr 1fr; }
  .row--3 { grid-template-columns: 1fr 1fr 1fr; }
  .row--main { grid-template-columns: minmax(0, 1.5fr) minmax(320px, .9fr); }
  .stack { display: grid; gap: 16px; }

  .panel { background: #fff; border: 1px solid var(--vs-grey-100); border-radius: var(--vs-r-lg); min-width: 0; }
  .panel__h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--vs-grey-100); }
  .panel__h h3 { margin: 0; font-size: 14.5px; }
  .panel__h p { margin: 0; font-size: 12.5px; color: var(--vs-text-3); }
  .panel__b { padding: 16px 18px; }
  .panel__b.tight { padding: 0; }
  .panel__b.tight table.data td:first-child, .panel__b.tight table.data th:first-child { padding-left: 18px; }
  .panel__b.tight table.data td:last-child, .panel__b.tight table.data th:last-child { padding-right: 18px; }
  .panel .empty { padding: 26px; text-align: center; color: var(--vs-text-3); font-size: 13.5px; }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th, table.data td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--vs-grey-100); vertical-align: middle; }
  table.data tbody tr:last-child td { border-bottom: 0; }
  table.data th { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--vs-text-3); white-space: nowrap; font-weight: 700; }
  table.data tr[data-go] { cursor: pointer; }
  table.data tr[data-go]:hover td { background: var(--vs-grey-50); }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data td.nw { white-space: nowrap; }
  table.data .sub { display: block; color: var(--vs-text-3); font-size: 12px; margin-top: 2px; }
  .mono { font-family: var(--vs-mono, ui-monospace, monospace); font-size: 12.5px; white-space: nowrap; }
  .muted { color: var(--vs-text-3); }
  .chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }

  .gate { max-width: 440px; margin: 72px auto; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 14px; font-size: 13.5px; margin: 0; }
  .kv dt { color: var(--vs-text-3); font-weight: 600; }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .notes { display: grid; gap: 8px; }
  .note { padding: 10px 12px; background: var(--vs-grey-50); border-radius: 8px; font-size: 13px; }
  .note time { color: var(--vs-text-3); font-size: 12px; display: block; margin-bottom: 2px; }
  .prod { display: flex; gap: 12px; align-items: center; }
  .prod img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: var(--vs-grey-100); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .span2 { grid-column: 1 / -1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chk { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .svc { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 6px; }
  .banner { padding: 12px 16px; border-radius: 10px; font-size: 13.5px; display: grid; gap: 4px; }
  .banner--high { background: var(--vs-error-50); }
  .banner--review { background: var(--vs-orange-50); }
  .banner--info { background: var(--vs-navy-50); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar .control { min-width: 150px; }
  .toolbar .control.grow { flex: 1; min-width: 220px; }
  h4.sec { margin: 18px 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--vs-text-3); }

  /* charts (pure CSS) */
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 6px; }
  .bars i { flex: 1; min-width: 4px; background: var(--vs-navy); border-radius: 3px 3px 0 0; position: relative; display: block; min-height: 2px; opacity: .92; }
  .bars i.alt { background: var(--vs-navy-100); }
  .bars i.zero { background: var(--vs-grey-150); }
  .bars i:hover { opacity: 1; filter: brightness(1.1); }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--vs-text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--vs-text-3); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--vs-navy); vertical-align: -1px; margin-right: 6px; }
  .legend i.alt { background: var(--vs-navy-100); }
  .hlist { display: grid; gap: 9px; }
  .hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: 13px; align-items: center; }
  .hrow .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hrow .val { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--vs-text-2); }
  .hrow .val small { color: var(--vs-text-3); margin-left: 6px; }
  .hrow .bar { grid-column: 1 / -1; height: 6px; background: var(--vs-grey-100); border-radius: 3px; overflow: hidden; }
  .hrow .bar i { display: block; height: 100%; background: var(--vs-navy); border-radius: 3px; }
  .hrow .bar i.orange { background: var(--vs-orange); }
  .funnel { display: grid; gap: 10px; }
  .fstep { display: grid; grid-template-columns: 130px minmax(0, 1fr) 90px; gap: 12px; align-items: center; font-size: 13px; }
  .fstep .bar { height: 22px; background: var(--vs-grey-100); border-radius: 6px; overflow: hidden; }
  .fstep .bar i { display: block; height: 100%; background: var(--vs-navy); border-radius: 6px; }
  .fstep .n { text-align: right; font-variant-numeric: tabular-nums; }
  .fstep .n small { display: block; color: var(--vs-text-3); font-size: 11.5px; }
  .tl { display: grid; gap: 0; position: relative; }
  .tl__i { display: grid; grid-template-columns: 118px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--vs-grey-100); font-size: 13px; }
  .tl__i:last-child { border-bottom: 0; }
  .tl__i time { color: var(--vs-text-3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl__i .k { font-weight: 600; }
  .tl__i .d { color: var(--vs-text-2); }
  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--vs-grey-50); font-size: 13px; text-decoration: none; color: inherit; }
  .alert.bad { background: var(--vs-error-50); }
  .alert.warn { background: var(--vs-orange-50); }
  .alert b { white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--vs-green); display: inline-block; margin-right: 6px; }
  .dot.off { background: var(--vs-grey-300); }

  @media (max-width: 1180px) { .row--3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; }
    .side nav { display: flex; flex-wrap: wrap; gap: 4px; }
    .side .grp { display: none; }
    .main { padding: 18px 16px 60px; }
    .row--2, .row--3, .row--main, .grid2 { grid-template-columns: 1fr; }
  }

  /* traffic: channel cards + stacked bars */
  .chans { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .chan { border: 1px solid var(--vs-grey-100); border-radius: var(--vs-r-md); padding: 12px; display: grid; gap: 6px; min-width: 0; }
  .chan--empty { opacity: .55; }
  .chan__h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chan__h b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .chan__bar { display: block; height: 6px; background: var(--vs-grey-50); border-radius: 3px; overflow: hidden; }
  .chan__bar i { display: block; height: 100%; background: var(--vs-navy); border-radius: 3px; }
  .chan small { display: block; font-size: 12px; color: var(--vs-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chan small.muted { color: var(--vs-text-3); }
  .bars.stacked span { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 3px; border-radius: 3px 3px 0 0; overflow: hidden; background: transparent; }
  .bars.stacked span b { display: block; width: 100%; min-height: 1px; }
  .bars.stacked span:hover { filter: brightness(.92); }
  .sec2 { font-size: 16px; margin: 22px 0 10px; }
  .panel__b.scrolly { max-height: 460px; overflow: auto; }
  .panel__b.scrolly thead th { position: sticky; top: 0; background: #fff; z-index: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/account/assets/vi.js"></script>
<script src="/account/assets/session.js"></script>
<script src="/account/assets/tax.js"></script>
<script>
(function () {
  /* ------------------------------------------------------------ helpers */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => (window.VSTax ? VSTax.formatCAD(c) : new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' }).format((Number(c) || 0) / 100));
  const num = n => new Intl.NumberFormat('en-CA').format(Number(n) || 0);
  const pct = (a, b) => b ? Math.round((1000 * a) / b) / 10 + '%' : '—';
  const when = iso => iso ? new Date(iso).toLocaleString('en-CA', { timeZone: 'America/Winnipeg', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const whenFull = iso => iso ? new Date(iso).toLocaleString('en-CA', { timeZone: 'America/Winnipeg', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
  const dayShort = d => { const [, m, dd] = String(d).split('-'); return `${Number(m)}/${Number(dd)}`; };
  const ago = iso => {
    if (!iso) return '—';
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now'; if (m < 60) return m + ' min'; const h = Math.round(m / 60); if (h < 48) return h + ' h'; return Math.round(h / 24) + ' d';
  };
  const chip = (label, kind) => `<span class="chip chip--${kind || 'navy'}">${esc(label)}</span>`;
  const statusChip = s => ({
    paid: chip('Paid', 'green'), pending_payment: chip('Pending', 'orange'), declined: chip('Declined'),
    expired: chip('Expired'), cancelled: chip('Cancelled'),
  }[s] || chip(s || '—'));
  const fulfillChip = s => ({
    unfulfilled: chip('Unfulfilled', 'orange'), processing: chip('Processing', 'navy'),
    in_transit: chip('In transit', 'navy'), delivered: chip('Delivered', 'green'), returned: chip('Returned'),
  }[s] || (s ? chip(s) : '—'));
  const riskChip = r => !r || r.level === 'clear' ? '' : chip(r.level === 'high' ? 'High risk' : 'Review', r.level === 'high' ? undefined : 'orange');
  const holdChip = h => h ? chip('Hold') : '';
  const DELIVERY = { freight: 'Curbside freight', white: 'White-glove', pickup: 'Dealer pickup' };
  const PROVS = ['AB','BC','MB','NB','NL','NS','NT','NU','ON','PE','QC','SK','YT'];
  const SVCS = [
    ['pickup','Pickup'],['delivery','Local delivery'],['installation','Installation'],
    ['measurement','Site measurement'],['design','Design'],['disposal','Disposal'],
  ];
  const phoneOut = p => {
    const d = String(p || '').replace(/\D/g, '').replace(/^1/, '');
    return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p || '');
  };

  /* ------------------------------------------------------------ state */
  let win = localStorage.getItem('vs.ops.win') || '7d';   // today | 7d | 30d | all
  let pendingOrderQ = '';
  let pendingFilters = {};
  let navCounts = null;
  function setWin(w) { win = w; localStorage.setItem('vs.ops.win', w); }
  const winFor = (api) => {
    if (api === 'traffic') return win === 'all' ? '30d' : win;
    if (api === 'payments') return win === '30d' ? 'all' : win;
    return win;
  };
  const WIN_LABEL = { today: 'Today', '7d': 'Last 7 days', '30d': 'Last 30 days', all: 'All time' };
  function hash() {
    const raw = (location.hash || '#overview').replace(/^#/, '');
    const path = raw.split('?')[0];
    const [page, ...rest] = path.split('/');
    return { page: page || 'overview', id: rest.length ? decodeURIComponent(rest.join('/')) : '' };
  }
  function go(h) { location.hash = h; }

  /* ------------------------------------------------------------ form bits */
  function sel(id, val, opts, extra = '') {
    return `<select class="control" id="${id}" ${extra}>${opts.map(([v, l]) => `<option value="${esc(v)}"${String(val)===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  }
  function field(id, label, value, extra = '') {
    return `<label class="field"><span class="field__label">${esc(label)}</span><input class="control" id="${id}" value="${esc(value ?? '')}" ${extra}></label>`;
  }
  function addrFields(p, a) {
    a = a || {};
    return `<div class="grid2">
      ${field(p+'Name','Recipient', a.name)}
      ${field(p+'Company','Company', a.company || '')}
      <div class="span2">${field(p+'Street','Street', a.street)}</div>
      ${field(p+'Unit','Unit', a.unit || '')}
      ${field(p+'City','City', a.city)}
      <label class="field"><span class="field__label">Province</span>${sel(p+'Prov', a.province, PROVS.map(x => [x, x]))}</label>
      ${field(p+'Postal','Postal code', a.postalCode)}
      ${field(p+'Phone','Phone', phoneOut(a.phone))}
    </div>`;
  }
  function readAddr(p) {
    return {
      name: ($('#'+p+'Name').value || '').trim(),
      company: ($('#'+p+'Company').value || '').trim(),
      street: ($('#'+p+'Street').value || '').trim(),
      unit: ($('#'+p+'Unit').value || '').trim(),
      city: ($('#'+p+'City').value || '').trim(),
      province: $('#'+p+'Prov').value,
      postalCode: ($('#'+p+'Postal').value || '').trim(),
      phone: ($('#'+p+'Phone').value || '').trim(),
    };
  }

  /* ------------------------------------------------------------ viz bits */
  function bars(series, key, opts = {}) {
    const max = Math.max(1, ...series.map(s => Number(s[key]) || 0));
    const fmt = opts.fmt || num;
    return `<div class="bars">${series.map(s => {
      const v = Number(s[key]) || 0;
      const h = v ? Math.max(3, Math.round((100 * v) / max)) : 2;
      return `<i class="${v ? (opts.alt ? 'alt' : '') : 'zero'}" style="height:${h}%" title="${esc(s.day || s.hour)} · ${esc(fmt(v))}"></i>`;
    }).join('')}</div>
    <div class="axis"><span>${esc(series.length ? (series[0].day ? dayShort(series[0].day) : series[0].hour + ':00') : '')}</span><span>${esc(series.length ? (series[series.length-1].day ? dayShort(series[series.length-1].day) : series[series.length-1].hour + ':00') : '')}</span></div>`;
  }
  function hlist(items, opts = {}) {
    if (!items || !items.length) return `<p class="muted" style="margin:0">${esc(opts.empty || 'No data yet.')}</p>`;
    const total = items.reduce((s, x) => s + (Number(x[opts.valueKey || 'count']) || 0), 0);
    const max = Math.max(1, ...items.map(x => Number(x[opts.valueKey || 'count']) || 0));
    return `<div class="hlist">${items.map(x => {
      const v = Number(x[opts.valueKey || 'count']) || 0;
      const label = opts.label ? opts.label(x) : (x.label || x.key || x.sku);
      const val = opts.fmt ? opts.fmt(v, x) : num(v);
      const share = opts.share === false ? '' : `<small>${pct(v, total)}</small>`;
      return `<div class="hrow"${x.go ? ` data-go="${esc(x.go)}" style="cursor:pointer"` : ''}><span class="lab" title="${esc(label)}">${esc(label)}</span><span class="val">${esc(val)}${share}</span><span class="bar"><i class="${opts.orange ? 'orange' : ''}" style="width:${Math.round((100 * v) / max)}%"></i></span></div>`;
    }).join('')}</div>`;
  }
  function funnel(steps) {
    const base = Math.max(1, steps[0] ? steps[0].n : 0);
    return `<div class="funnel">${steps.map((s, i) => {
      const prev = i ? steps[i - 1].n : s.n;
      const step = !i ? '100%' : s.n > prev ? 'more than prev — traffic gap' : pct(s.n, prev) + ' of prev';
      return `<div class="fstep"><span>${esc(s.label)}</span><span class="bar"><i style="width:${Math.min(100, Math.round((100 * s.n) / base))}%"></i></span><span class="n">${num(s.n)}<small>${step}</small></span></div>`;
    }).join('')}</div>`;
  }
  function panel(title, body, opts = {}) {
    return `<section class="panel"><div class="panel__h"><div><h3>${esc(title)}</h3>${opts.sub ? `<p>${opts.sub}</p>` : ''}</div>${opts.right || ''}</div><div class="panel__b ${opts.tight ? 'tight' : ''} ${opts.cls || ''}">${body}</div></section>`;
  }
  const table = (head, rows, empty) => rows
    ? `<table class="data"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`
    : `<p class="empty">${esc(empty || 'Nothing here.')}</p>`;
  const kpi = (label, value, sub, opts = {}) => {
    const tag = opts.go ? 'a' : opts.jump ? 'button' : 'div';
    const attrs = opts.go ? ` href="#${opts.go}"` : opts.jump ? ` type="button" data-jump="${opts.jump}"` : '';

  async function api(path, opts = {}) {
    const r = await fetch(path, {
      ...opts,
      headers: { 'content-type': 'application/json', ...VSSession.headers(), ...(opts.headers || {}) },
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || 'request_failed'), { status: r.status, data });
    return data;
  }
  async function run(btn, fn, ok) {
    if (btn) btn.disabled = true;

    catch (e) { VS.toast(e.data && e.data.error ? e.data.error.replace(/_/g, ' ') : e.message, 'error'); }
    finally { if (btn) btn.disabled = false; }
  }

        ${kpi('Paid today', esc(money(o.todayCents)), `${o.todayCount} order${o.todayCount === 1 ? '' : 's'}`, { jump: 'paid-today' })}

        ${panel('Visitors by day', tr ? bars(tr.daily, 'visitors') : '<p class="empty">Traffic API unavailable.</p>', { sub: tr && tr.collecting ? `${WIN_LABEL[win === 'all' ? '30d' : win]} · unique visitors` : 'Collecting starts when a storefront page loads', right: `<span class="legend"><span><i></i>Visitors</span></span>` })}

          ${panel('Health', `<dl class="kv">

            <dt>Mail</dt><dd><span class="dot ${s.health.mail ? '' : 'off'}"></span>${s.health.mail ? 'Azure Communication Services' : 'off'}</dd>
            <dt>POS / Go</dt><dd><span class="dot ${s.health.pos ? '' : 'off'}"></span>${s.health.pos ? 'ready' : 'off'}</dd>
            <dt>ERP</dt><dd><span class="dot ${s.health.erp ? '' : 'off'}"></span>${s.health.erp ? 'Order/syncEspoQuote' : 'off'}</dd>
            <dt>Traffic</dt><dd><span class="dot ${tr && tr.collecting ? '' : 'off'}"></span>${tr && tr.collecting ? 'collecting' : 'no events yet'}</dd>
          </dl>`, { right: `<a href="#ops" class="muted" style="font-size:12.5px">System →</a>` })}
        </div>
      </div>`, { win: true });
  }

  function timeline(o) {
    const ev = [];
    ev.push({ at: o.createdAt, k: 'Order created', d: `${o.guest ? 'Guest' : 'Account'} checkout · ${o.payChannel === 'pos' ? 'POS / Go' : 'card online'} · ${esc(o.locale || '')}` });
    (o.consents || []).forEach(c => ev.push({ at: c.at, k: 'Consent', d: `${esc(c.kind)} · ip ${esc(c.ip || '—')}` }));
    (o.paymentAttempts || []).forEach(a => ev.push({ at: a.at, k: `Card attempt #${a.n}`, d: a.outcome ? `${esc(a.outcome)}${a.code ? ' · ' + esc(a.label || a.code) : ''}` : 'unresolved — no response recorded' }));
    if (o.declined && !(o.paymentAttempts || []).some(a => a.at === o.declined.at)) ev.push({ at: o.declined.at, k: 'Declined', d: esc(o.declined.code) });
    if (o.openedAt && o.openedAt !== o.createdAt) ev.push({ at: o.openedAt, k: 'Reopened for payment', d: 'TTL restarted by ops' });
    if (o.pos && o.pos.pushedAt) ev.push({ at: o.pos.pushedAt, k: 'Pushed to terminal', d: `${esc(o.posTerminalId || '')} · ${esc(o.pos.status)}${o.pos.cloudTicket ? ' · ticket ' + esc(o.pos.cloudTicket) : ''}` });
    if (o.payment && o.payment.paidAt) ev.push({ at: o.payment.paidAt, k: 'Paid', d: `${esc(o.payment.brand || '')} •••• ${esc(o.payment.last4 || '')} · ${esc(money(o.payment.amountCents || o.quote.totalCents))}${o.payment.threeDS ? ' · 3DS' : ''}` });
    if (o.erp && o.erp.at) ev.push({ at: o.erp.at, k: o.erp.status === 'success' ? 'Pushed to ERP' : o.erp.status === 'skipped' ? 'ERP skipped' : 'ERP push failed', d: `${esc(o.erp.path || 'Order/syncEspoQuote')} · ${o.erp.attempts || 1} attempt${(o.erp.attempts || 1) === 1 ? '' : 's'}${o.erp.error ? ' · ' + esc(o.erp.error) : ''}` });
    if (o.invoiceDate) ev.push({ at: o.invoiceDate, k: 'Invoice issued', d: esc(o.invoiceNo || '') });
    (o.notifications || []).forEach(n => ev.push({ at: n.sentAt || o.createdAt, k: n.sentAt ? 'Mail sent' : 'Mail failed', d: `${esc(n.kind.replace(/_/g, ' '))} → ${esc(n.to)}${n.error ? ' · ' + esc(n.error) : ''}` }));
    if (o.riskHold) ev.push({ at: o.riskHold.at, k: 'Risk hold', d: `${esc(o.riskHold.reason)} · ${esc(o.riskHold.by)}` });
    (o.internalNotes || []).forEach(n => ev.push({ at: n.at, k: 'Note', d: `${esc(n.by)}: ${esc(n.text)}` }));
    if (o.claimedAt) ev.push({ at: o.claimedAt, k: 'Claimed by account', d: esc(o.userId || '') });
    ev.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    return `<div class="tl">${ev.map(e => `<div class="tl__i"><time>${esc(whenFull(e.at))}</time><div><span class="k">${e.k}</span><div class="d">${e.d}</div></div></div>`).join('')}</div>`;
  }

      api('/api/admin/orders/' + encodeURIComponent(id)),

    const canMoney = !!o.canEditMoney;
    const canFulfill = o.status === 'paid' || o.status === 'cancelled';
    const risk = o.risk || { level: 'clear', signals: [], score: 0 };
    const attempts = (o.paymentAttempts || []).map(a => `<tr>
      <td>${a.n}</td>
      <td class="nw">${when(a.at)}</td>
      <td>${esc(a.outcome || 'unresolved')}</td>
      <td>${esc(a.label || a.code || '—')}</td>
    </tr>`).join('');

        <span>${sigs}</span>
      </div>` : ''}
      <div class="kpis">
        ${kpi('Total', esc(money(o.quote.totalCents)), `${units} unit${units === 1 ? '' : 's'} · ${esc(o.quote.tax && o.quote.tax.province || o.shipping.province)} tax`)}
        ${kpi('Payment', o.payment ? `${esc(o.payment.brand || 'Card')} ••${esc(o.payment.last4 || '')}` : esc(o.status.replace('_', ' ')), o.payment ? `paid ${when(o.payment.paidAt)}${o.payment.threeDS ? ' · 3DS' : ' · no 3DS'}` : `${(o.paymentAttempts || []).length} attempt${(o.paymentAttempts || []).length === 1 ? '' : 's'}${o.declined ? ' · last ' + esc(o.declined.code) : ''}`, { kind: o.status === 'declined' ? 'bad' : o.status === 'pending_payment' ? 'warn' : '' })}
        ${kpi('Delivery', esc(DELIVERY[o.deliveryMethod] || o.deliveryMethod), o.dealer ? `${esc(o.dealer.name)} · ${esc(o.dealer.city)}` : 'Vanstro direct')}
        ${kpi('Fulfillment', esc((o.fulfillment || (canFulfill ? 'unfulfilled' : 'locked')).replace('_', ' ')), o.riskHold ? 'blocked by risk hold' : canFulfill ? 'ready to hand off' : 'unlocks after payment', { kind: o.riskHold ? 'bad' : '' })}
        ${kpi('Risk', `${risk.score}`, risk.level === 'clear' ? 'no signals' : `${risk.level} · ${(risk.signals || []).length} signal${(risk.signals || []).length === 1 ? '' : 's'}`, { kind: risk.level === 'high' ? 'bad' : risk.level === 'review' ? 'warn' : '' })}
        ${kpi('Invoice', o.invoiceNo ? `<span class="mono">${esc(o.invoiceNo)}</span>` : '—', o.invoiceDate ? when(o.invoiceDate) : 'issued when paid')}

            ${attempts ? `<h4 class="sec">Attempts</h4><table class="data"><thead><tr><th>#</th><th>When</th><th>Outcome</th><th>Code</th></tr></thead><tbody>${attempts}</tbody></table>` : ''}
            ${o.payChannel === 'pos' ? `<h4 class="sec">POS / Go</h4><dl class="kv"><dt>Terminal</dt><dd class="mono">${esc(o.posTerminalId || '—')}</dd><dt>Push</dt><dd>${esc(o.pos ? o.pos.status : 'idle')}${o.pos && o.pos.error ? ' · ' + esc(o.pos.error) : ''}</dd></dl>` : ''}`)}
          ${panel('ERP', o.status === 'paid' ? `<dl class="kv">

              <dt>Espo accountId</dt><dd class="mono">${esc((o.erp && o.erp.accountId) || '—')}</dd>
            </dl>
            <p class="muted" style="margin:10px 0 0;font-size:12.5px">Same id space as CRM: <span class="mono">source: EspoCRM</span>, Espo User + Account. Set those ids on the dealer (and the customer for Hosted Tokenization). A failed push does not un-pay the order.</p>
            <button type="button" class="btn btn--secondary btn--sm" id="erpGo" style="margin-top:10px">${o.erp && o.erp.status === 'success' ? 'Push again' : 'Push to ERP'}</button>`
            : `<p class="muted" style="margin:0;font-size:12.5px">ERP receives the order only after payment is captured.</p>`)}
          ${panel('Risk hold', `

          ${panel('Fulfillment', `
            <select class="control" id="ff" ${canFulfill ? '' : 'disabled'}>
              ${['unfulfilled','processing','in_transit','delivered','returned'].map(s => `<option value="${s}"${(o.fulfillment||'unfulfilled')===s?' selected':''}>${s.replace('_',' ')}</option>`).join('')}
            </select>
            <button type="button" class="btn btn--secondary btn--sm" id="ffGo" style="margin-top:10px" ${canFulfill ? '' : 'disabled'}>Update fulfillment</button>

          ${panel('Mail', `
            ${field('resendTo','Send to', o.email, 'type="email"')}

            <button type="button" class="btn btn--secondary btn--sm" id="resend" style="margin-top:10px" ${o.status==='paid'?'':'disabled'}>Send</button>
            ${o.status==='paid'?'':'<p class="muted" style="margin:8px 0 0;font-size:12.5px">Receipts send after the order is paid.</p>'}
            ${(o.notifications || []).length ? `<h4 class="sec">Sent</h4>${(o.notifications || []).map(n => `<p style="margin:4px 0;font-size:12.5px">${n.sentAt ? '<span class="dot"></span>' : '<span class="dot off"></span>'}${esc(n.kind.replace(/_/g,' '))} → ${esc(n.to)} <span class="muted">${n.sentAt ? when(n.sentAt) : esc(n.error || 'failed')}</span></p>`).join('')}` : ''}`)}
          ${panel('Internal notes', `
            <div class="notes">${notes}</div>
            <textarea class="control" id="note" rows="3" placeholder="Visible to staff only" style="margin-top:10px"></textarea>
            <button type="button" class="btn btn--secondary btn--sm" id="noteGo" style="margin-top:10px">Add note</button>`)}
          ${panel('Record', `<dl class="kv">
            <dt>Order</dt><dd class="mono">${esc(o.orderNo)}</dd>
            <dt>Account</dt><dd>${o.userId ? `<span class="mono">${esc(o.userId)}</span>${o.claimedAt ? ' · claimed ' + when(o.claimedAt) : ''}` : 'guest'}</dd>
            <dt>Locale</dt><dd>${esc(o.locale || '—')}</dd>
            <dt>Client IP</dt><dd class="mono">${esc(o.clientIp || '—')}</dd>
            <dt>Consents</dt><dd>${(o.consents || []).map(c => esc(c.kind)).join(', ') || '—'}</dd>
            <dt>Opened</dt><dd>${whenFull(o.openedAt || o.createdAt)}</dd>
            <dt>Save card</dt><dd>${o.saveCard ? 'requested' : 'no'}</dd>
            <dt>Status link</dt><dd><a href="${esc(o.statusHref)}" target="_blank" rel="noopener" style="font-size:12.5px">order-status ↗</a></dd>
          </dl>`)}
        </div>
      </div>`);
  }

  /* ------------------------------------------------------------ payments */
  async function payments() {
    const d = await api('/api/admin/payments?window=' + encodeURIComponent(winFor('payments')));
    const t = d.totals || {};
    const ch = d.byChannel || { ht: {}, pos: {} };
    const brands = Object.entries(d.byBrand || {}).map(([key, v]) => ({ key, count: v.cents, paid: v.paid }));
    const codes = (d.declineCodes || []).map(c => `<tr><td class="mono">${esc(c.code)}</td><td>${esc(c.label)}</td><td class="num">${c.count}</td></tr>`).join('');
    const clusters = (d.last4Clusters || []).map(x => `<tr><td class="mono">•••• ${esc(x.last4)}</td><td>${esc(x.brand)}</td><td class="num">${x.emails}</td><td class="num">${x.orders}</td><td class="num">${x.paid}</td></tr>`).join('');
    const daily = (d.daily || []).slice(-30);
    const dailyRows = daily.slice().reverse().slice(0, 14).map(x => `<tr><td class="nw">${esc(x.day)}</td><td class="num">${x.paid}</td><td class="num">${x.declined}</td><td class="num">${esc(money(x.paidCents))}</td></tr>`).join('');
    return chrome('payments', title('Payments', `${WIN_LABEL[winFor('payments')]} · attempts, decline codes, channels, last-4 clusters · no PAN stored`), `
      <div class="kpis">
        ${kpi('Paid', esc(money(t.paidCents)), `${t.paid || 0} orders`)}
        ${kpi('Approval rate', t.approvalRate == null ? '—' : t.approvalRate + '%', `${t.attempts || 0} attempts`)}
        ${kpi('Declined', num(t.declined || 0), `${t.expired || 0} expired · ${t.pending || 0} open`, { kind: t.declined ? 'warn' : '' })}
        ${kpi('3-D Secure', num(t.threeDS || 0), `${t.no3DS || 0} paid without 3DS`)}
        ${kpi('Unresolved', num((d.unresolved || []).length), 'do not retry a new card', { kind: (d.unresolved || []).length ? 'bad' : '' })}
        ${kpi('High risk', num((d.highRisk || []).length), 'in window', { kind: (d.highRisk || []).length ? 'bad' : '' })}
      </div>
      <div class="row row--2">
        ${panel('Paid vs declined by day', daily.length ? `${bars(daily, 'paid')}<div style="height:8px"></div>${bars(daily, 'declined', { alt: true })}` : '<p class="empty">No activity.</p>', { sub: 'Winnipeg days', right: '<span class="legend"><span><i></i>Paid</span><span><i class="alt"></i>Declined</span></span>' })}
        ${panel('Channel', table('<th></th><th class="num">Paid</th><th class="num">CAD</th><th class="num">Declined</th><th class="num">Open</th>', `
            <tr><td>Hosted tokenization (card online)</td><td class="num">${ch.ht.paid||0}</td><td class="num">${esc(money(ch.ht.cents))}</td><td class="num">${ch.ht.declined||0}</td><td class="num">${ch.ht.pending||0}</td></tr>
            <tr><td>POS / Vanstro Go</td><td class="num">${ch.pos.paid||0}</td><td class="num">${esc(money(ch.pos.cents))}</td><td class="num">${ch.pos.declined||0}</td><td class="num">${ch.pos.pending||0}</td></tr>`) + `<div style="padding:14px 18px">${hlist(brands, { fmt: money, label: x => x.key + ' · ' + x.paid + ' paid', empty: 'No card brands yet.' })}</div>`, { tight: true, sub: 'channel and card brand' })}
      </div>
      <div class="row row--3">
        ${panel('Decline / error codes', table('<th>Code</th><th>Meaning</th><th class="num">n</th>', codes, 'No declines in this window.'), { tight: true })}
        ${panel('Last-4 clusters', table('<th>Last 4</th><th>Brand</th><th class="num">Emails</th><th class="num">Orders</th><th class="num">Paid</th>', clusters, 'No clusters.'), { tight: true, sub: 'same last-4 across emails or ≥3 orders' })}
        ${panel('Daily', table('<th>Day</th><th class="num">Paid</th><th class="num">Declined</th><th class="num">CAD</th>', dailyRows, 'No activity.'), { tight: true })}
      </div>
      <div class="row row--2">
        ${panel('Unresolved attempts', table(ORDER_HEAD, orderRows(d.unresolved), 'None.'), { tight: true, sub: 'a card call got no answer — wait for reconciliation' })}
        ${panel('High risk in window', table(ORDER_HEAD, orderRows(d.highRisk), 'None.'), { tight: true })}
      </div>`, { win: true, winOpts: ['today', '7d', 'all'] });
  }

  /* ------------------------------------------------------------ risk */
  async function riskPage() {
    const d = await api('/api/admin/risk');
    const blocks = (d.blocks || []).map(b => `<tr>
      <td>${esc(b.email)}</td>
      <td>${esc(b.reason)}</td>
      <td class="nw">${esc(b.by)} · ${when(b.at)}</td>
      <td class="num"><button type="button" class="btn btn--ghost btn--sm" data-unblock="${esc(b.email)}">Unblock</button></td>
    </tr>`).join('');
    const holds = (d.holds || []).map(o => `<tr data-go="#orders/${encodeURIComponent(o.orderNo)}">
      <td class="mono">${esc(o.orderNo)}</td><td>${esc(o.email)}</td><td>${esc(o.riskHold && o.riskHold.reason || '')}<span class="sub">${esc(o.riskHold && o.riskHold.by || '')} · ${when(o.riskHold && o.riskHold.at)}</span></td><td class="num">${esc(money(o.quote.totalCents))}</td>
    </tr>`).join('');
    const sigCounts = {};
    (d.queue || []).forEach(o => (o.risk && o.risk.signals || []).forEach(s => { sigCounts[s.label] = (sigCounts[s.label] || 0) + 1; }));
    const sigList = Object.entries(sigCounts).map(([key, count]) => ({ key, count })).sort((a, b) => b.count - a.count);
    return chrome('risk', title('Risk', 'Score from attempts, ticket size, address mismatch, velocity, and last-4 reuse · hold blocks shipping, block stops new checkouts'), `
      <div class="kpis">
        ${kpi('High', num((d.high || []).length), 'open the order list', { jump: 'risk-high', kind: (d.high || []).length ? 'bad' : '' })}
        ${kpi('Review', num((d.review || []).length), 'signals, no hold', { jump: 'risk-review', kind: (d.review || []).length ? 'warn' : '' })}
        ${kpi('Holds', num((d.holds || []).length), 'do not ship', { jump: 'risk-hold' })}
        ${kpi('Blocked emails', num((d.blocks || []).length), 'checkout returns 403')}
      </div>
      <div class="row row--main">
        <div class="stack">
          ${panel('Queue', table(ORDER_HEAD, orderRows(d.queue), 'Queue is empty.'), { tight: true, sub: 'high and review, newest first' })}
          ${panel('Active holds', table('<th>Order</th><th>Customer</th><th>Reason</th><th class="num">Total</th>', holds, 'No holds.'), { tight: true })}
        </div>
        <div class="stack">
          ${panel('Signals in queue', hlist(sigList, { empty: 'No signals.', orange: true }), { sub: 'how often each heuristic fires' })}
          ${panel('Block an email', `
            ${field('riskEmail','Email', '', 'type="email"')}
            <div style="margin-top:10px">${field('riskReason','Reason', 'Blocked by ops')}</div>
            <div class="actions"><button type="button" class="btn btn--primary btn--sm" id="blockGo">Block checkout</button></div>`)}
          ${panel('Blocked emails', table('<th>Email</th><th>Reason</th><th>By</th><th></th>', blocks, 'No blocked emails.'), { tight: true })}
        </div>
      </div>`);
  }

  /* ------------------------------------------------------------ traffic */
  const CHANNEL_LABEL = { organic: 'Organic search', paid: 'Paid', social: 'Social', ai: 'AI assistants', email: 'Email / SMS', referral: 'Referral', direct: 'Direct', internal: 'Internal' };
  const CHANNEL_HELP = { organic: 'Google, Bing, DuckDuckGo, Yahoo, Baidu…', paid: 'gclid / fbclid / msclkid / ttclid or utm_medium=cpc', social: 'Facebook, Instagram, TikTok, Pinterest, YouTube, LinkedIn, X, Reddit…', ai: 'ChatGPT, Perplexity, Copilot, Gemini, Claude referrals', email: 'utm_medium=email · newsletter · sms', referral: 'Other websites', direct: 'Typed / bookmark / app with no referrer', internal: 'Navigation within the site' };
  const chanChip = k => chip(CHANNEL_LABEL[k] || k, { organic: 'green', paid: 'orange', social: 'navy', ai: 'navy', email: 'navy', referral: 'navy', direct: 'navy', internal: 'navy' }[k] || 'navy');
  function acqRows(list, opts = {}) {
    return list.map(b => `<tr>
      <td>${opts.label ? opts.label(b) : esc(b.label || b.key)}${opts.channel && b.channel ? `<span class="sub">${esc(CHANNEL_LABEL[b.channel] || b.channel)}</span>` : ''}</td>
      <td class="num">${num(b.sessions)}</td>
      <td class="num">${num(b.visitors)}</td>
      <td class="num">${b.bounceRate}%</td>
      <td class="num">${num(b.cart)}</td>
      <td class="num">${num(b.checkout)}</td>
      <td class="num">${num(b.paid)}</td>
      <td class="num">${esc(money(b.cents))}</td>
      <td class="num">${b.conversion}%</td>
    </tr>`).join('');
  }
  const ACQ_HEAD = '<th class="num">Sessions</th><th class="num">Visitors</th><th class="num">Bounce</th><th class="num">Cart</th><th class="num">Checkout</th><th class="num">Paid</th><th class="num">Revenue</th><th class="num">Conv.</th>';
  function stackedDaily(days) {
    const keys = [['organic', 'var(--vs-green)'], ['paid', 'var(--vs-orange)'], ['social', 'var(--vs-navy)'], ['direct', 'var(--vs-grey-300)']];

        ${field('dAreaFr','Area (FR)', x.areaFr || '')}
        <div class="span2"><span class="field__label">Services</span><div class="svc">${SVCS.map(([id,l]) => `<label class="chk"><input type="checkbox" data-svc="${id}"${ids.has(id)?' checked':''}> ${esc(l)}</label>`).join('')}</div></div>
        ${field('dErpAccount','ERP Account id', x.erpAccountId || '', 'placeholder="MB01" autocomplete="off"')}
        ${field('dErpUser','ERP User id', x.erpUserId || '', 'placeholder="ERP userId on POS" autocomplete="off"')}
        <label class="chk span2"><input type="checkbox" id="dOff"${x.disabled?' checked':''}> Hide from checkout and invite sign-up</label>
      </div>
      <p class="muted" style="margin:10px 0 0;font-size:12.5px">Paste the Espo Account id ERP already has for this dealer (Yuan / MB01 is <span class="mono">6a8810b93b08b6495</span>), not the storefront id (${esc(x.id || 'AB-FOOTHILL')}).</p>`;
  }

  async function dealerDetail(id) {
    if (id === 'new') {
      return chrome('dealer', title('Add dealer', '', '<a href="#dealers">Dealers</a> · New'), `
        ${panel('New dealer', `${dealerForm({ province: 'MB', serviceIds: ['pickup','delivery'] })}
          <div class="actions"><button type="button" class="btn btn--primary" id="createDealer">Create dealer</button></div>`)}`);
    }
    const [d, rep] = await Promise.all([api('/api/admin/dealers'), api('/api/admin/reports?window=all').catch(() => null)]);
    const x = (d.dealers || []).find(n => n.id === id);
    if (!x) throw Object.assign(new Error('not_found'), { status: 404 });
    const share = rep ? (rep.dealers || []).find(r => r.key === x.id) : null;
    return chrome('dealer', title(x.name, `<span class="chips">${x.disabled ? chip('Off', 'orange') : chip('Live', 'green')}</span> &nbsp; ${esc(x.code)} · ${esc(x.city)}, ${esc(x.province)}${x.terminalId ? ` · terminal <span class="mono">${esc(x.terminalId)}</span>` : ''}`, `<a href="#dealers">Dealers</a> · ${esc(x.id)}`), `
      <div class="kpis">
        ${kpi('Paid through dealer', esc(money(x.paidCents)), `${x.paid} paid / ${x.orders} orders`)}
        ${kpi('Share of dealer sales', share && rep ? pct(share.cents, rep.dealers.reduce((a, r) => a + (r.key === 'direct' ? 0 : r.cents), 0)) : '—', 'all time')}
        ${kpi('Invite code', `<span class="mono">${esc(x.inviteCode)}</span>`, 'staff-only')}
        ${kpi('Services', num((x.services || []).length), esc((x.services || []).map(s => s.id || s).join(', ')))}
      </div>
      <div class="toolbar"><button type="button" class="btn btn--secondary btn--sm" data-jump-dealer="${esc(x.id)}">View orders</button></div>
      ${panel('Dealer record', `${dealerForm(x)}<div class="actions"><button type="button" class="btn btn--primary" id="saveDealer">Save dealer</button></div>`)}`);
  }

  /* ------------------------------------------------------------ system */
  async function ops() {
    const d = await api('/api/admin/ops');
    const rows = Object.entries(d.keys).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${typeof v === 'boolean' ? (v ? chip('Set', 'green') : chip('Empty', 'orange')) : esc(String(v))}</td></tr>`).join('');
    const fmtB = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b > 1024 ? Math.round(b / 1024) + ' KB' : b + ' B';
    const up = d.process ? d.process.uptimeSec : 0;
    const upTxt = up > 3600 ? Math.floor(up / 3600) + ' h ' + Math.round((up % 3600) / 60) + ' min' : Math.round(up / 60) + ' min';
    return chrome('ops', title('System', `${esc(d.bind.host)}:${d.bind.port} · APP_URL host ${esc(d.bind.appHost || '—')} · TRUST_PROXY ${d.bind.trustProxy ? 'on' : 'off'}`), `
      <div class="kpis">
        ${kpi('Payment mode', esc(d.health.payment), d.health.payment === 'live' ? 'Moneris' : 'MONERIS_MOCK', { kind: d.health.payment === 'live' ? '' : 'warn' })}
        ${kpi('Mail', d.health.mail ? 'ACS' : 'off', d.mailRedirect ? 'redirected — not reaching customers' : 'AZURE_COMMUNICATION_CONNECTION_STRING', { kind: d.health.mail ? (d.mailRedirect ? 'warn' : '') : 'bad' })}
        ${kpi('POS / Go', d.health.pos ? 'ready' : 'off', 'MONERIS_GO_*')}
        ${kpi('ERP', d.health.erp ? 'ready' : 'off', 'ERP_BASE_URL + ERP_TOKEN', { kind: d.health.erp ? '' : 'warn' })}
        ${kpi('Uptime', upTxt, d.process ? `node ${esc(d.process.node)} · ${d.process.rssMb} MB` : '')}
        ${kpi('Orders on disk', d.data ? num(d.data.orders.files) : '—', d.data ? fmtB(d.data.orders.bytes) + ' · data/orders' : '')}
        ${kpi('Traffic on disk', d.data ? num(d.data.traffic.files) + ' days' : '—', d.data ? fmtB(d.data.traffic.bytes) + ' · data/traffic' : '')}
      </div>
      ${d.mailRedirect ? '<div class="banner banner--review"><strong>MAIL_REDIRECT_TO is set</strong><span>Outbound mail is not going to real customers.</span></div>' : ''}
      <div class="row row--main">
        ${panel('Environment', table('<th>Key</th><th>Present</th>', rows), { tight: true, sub: 'values are never shown' })}
        <div class="stack">
          ${panel('Data stores', `<dl class="kv">
            <dt>Orders</dt><dd><span class="mono">data/orders/*.json</span></dd>
            <dt>Traffic</dt><dd><span class="mono">data/traffic/YYYY-MM-DD.jsonl</span></dd>
            <dt>Risk</dt><dd><span class="mono">data/risk.json</span> — holds, blocked emails</dd>
            <dt>Catalogue</dt><dd><span class="mono">data/catalogue-overrides.json</span></dd>
            <dt>Dealers</dt><dd><span class="mono">data/dealers.json</span></dd>
            <dt>CRM</dt><dd><span class="mono">data/customer-crm.json</span></dd>
          </dl>`)}
          ${panel('Auth', `<p style="margin:0;font-size:13px">Staff access is the prototype <span class="mono">x-vs-user</span> header with role <span class="mono">staff</span>. Every <span class="mono">/api/admin/*</span> route returns 403 to customers and dealers. Production replaces the gate with the IdP group.</p><p class="muted" style="margin:10px 0 0;font-size:12.5px">Docs: <a href="docs/12-admin.md" target="_blank">12-admin.md</a> · <a href="docs/09-deploy-handoff.md" target="_blank">09-deploy-handoff.md</a></p>`)}
        </div>
      </div>`);
  }

  function readDealer() {
    return {
      id: ($('#dId') && !$('#dId').disabled) ? $('#dId').value.trim() : undefined,
      code: $('#dCode').value.trim(),
      inviteCode: $('#dInvite').value.trim() || undefined,
      name: $('#dName').value.trim(),
      street: $('#dStreet').value.trim(),
      city: $('#dCity').value.trim(),
      province: $('#dProv').value,
      postalCode: $('#dPostal').value.trim(),
      phone: $('#dPhone').value.trim(),
      email: $('#dEmail').value.trim(),
      hoursEn: $('#dHoursEn').value.trim(),
      hoursFr: $('#dHoursFr').value.trim(),
      areaEn: $('#dAreaEn').value.trim(),
      areaFr: $('#dAreaFr').value.trim(),
      services: $$('input[data-svc]:checked').map(x => x.dataset.svc),
      disabled: $('#dOff').checked,
      erpAccountId: $('#dErpAccount').value.trim(),
      erpUserId: $('#dErpUser').value.trim(),
    };
  }

  /* ------------------------------------------------------------ render */
  async function render() {
    const root = $('#app');
    if (!staffSession()) {
      root.innerHTML = gate();
      $('#gGo').onclick = () => {
        const email = ($('#gEmail').value || '').trim().toLowerCase();
        const pw = $('#gPw').value || $('#gPw').getAttribute('data-demo') || '';
        if ((email === 'ops@vanstro.ca' || email === 'admin@vanstro.ca') && pw === 'Vanstro2026!') {
          setStaff('ops@vanstro.ca'); render();
        } else {
          $('#gErr').hidden = false; $('#gErr').textContent = 'Not a staff account.';
        }
      };
      return;
    }
    const { page, id } = hash();
    try {
      if (!navCounts) await loadNavCounts();
      if (page === 'orders' && id) root.innerHTML = await orderDetail(id);
      else if (page === 'orders') root.innerHTML = await ordersList();
      else if (page === 'payments') root.innerHTML = await payments();
      else if (page === 'risk') root.innerHTML = await riskPage();
      else if (page === 'traffic') root.innerHTML = await traffic();
      else root.innerHTML = await overview();
      bind(page, id);
    } catch (e) {
      root.innerHTML = `<div class="alert bad">${esc(e.message || 'Unable to load admin console')}</div>`;
    }
  }

  function bind(page, id) {
    $$('[data-go]').forEach(el => el.addEventListener('click', e => { if (e.target.closest('a,button,input')) return; go(el.getAttribute('data-go').replace(/^#/, '')); }));
    $('#jump')?.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const v = e.currentTarget.value.trim(); if (!v) return;
      if (/^VS-\d{4}-\d{6}/i.test(v)) go('orders/' + encodeURIComponent(v.toUpperCase()));
      else if (v.includes('@')) go('customers/' + encodeURIComponent(v.toLowerCase()));
      else { pendingOrderQ = v; go('orders'); if (hash().page === 'orders') render(); }
    });
    $('#fGo')?.addEventListener('click', () => render());
    $('#fQ')?.addEventListener('keydown', e => { if (e.key === 'Enter') render(); });
    $('#cGo')?.addEventListener('click', () => render());
    $('#cQ')?.addEventListener('keydown', e => { if (e.key === 'Enter') render(); });
    $('#pGo')?.addEventListener('click', () => render());
    $('#pQ')?.addEventListener('keydown', e => { if (e.key === 'Enter') render(); });
    $$('[data-jump]').forEach(btn => btn.addEventListener('click', e => {
      e.preventDefault();
      const k = btn.dataset.jump;
      pendingFilters = k === 'pending' ? { status: 'pending_payment' }
        : k === 'unfulfilled' ? { status: 'paid', fulfillment: 'unfulfilled' }
        : k === 'guest' ? { guest: '1' }
        : k === 'risk-high' ? { risk: 'high' } : k === 'risk-review' ? { risk: 'review' } : k === 'risk-hold' ? { risk: 'hold' }
        : { status: 'paid' };
      go('orders');
    }));
    $$('[data-jump-dealer]').forEach(btn => btn.addEventListener('click', () => { pendingOrderQ = btn.dataset.jumpDealer; go('orders'); }));
    $$('[data-jump-q]').forEach(btn => btn.addEventListener('click', () => { pendingOrderQ = btn.dataset.jumpQ; go('orders'); }));
    $$('[data-win]').forEach(btn => btn.addEventListener('click', () => { setWin(btn.dataset.win); render(); }));

    $('#kwAdd')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const term = $('#kwTerm').value.trim(); if (!term) { VS.toast('Enter a keyword', 'error'); return; }
      await api('/api/admin/seo', { method: 'POST', body: JSON.stringify({ action: 'add_keyword', term, targetPath: $('#kwPath').value.trim() || '/' }) });
      render();
    }, 'Keyword added'));
    $$('[data-kw-del]').forEach(btn => btn.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/seo', { method: 'POST', body: JSON.stringify({ action: 'remove_keyword', id: btn.dataset.kwDel }) });
      render();
    }, 'Removed')));
    $('#gscGo')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const csv = $('#gscCsv').value; if (csv.trim().length < 10) { VS.toast('Paste a Search Console CSV', 'error'); return; }
      const r = await api('/api/admin/seo', { method: 'POST', body: JSON.stringify({ action: 'import_gsc', csv, label: $('#gscLabel').value.trim() || undefined }) });
      VS.toast(`Imported ${r.import.rows} ${r.import.kind}`); render();
    }));
    $$('[data-imp-del]').forEach(btn => btn.addEventListener('click', ev => run(ev.currentTarget, async () => {
      if (!confirm('Delete this import?')) return;
      await api('/api/admin/seo', { method: 'POST', body: JSON.stringify({ action: 'remove_import', id: btn.dataset.impDel }) });
      render();
    }, 'Deleted')));

    $('#erpGo')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ erpPush: true }) });
      render();
    }, 'ERP push finished'));

    $('#reopen')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ reopen: true }) });
      render();
    }, 'Reopened for payment'));

    $('#cloneOrder')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const { order } = await api('/api/admin/orders', { method: 'POST', body: JSON.stringify({ cloneFrom: id }) });
      go('orders/' + encodeURIComponent(order.orderNo));
    }, 'Cloned'));

    $('#holdGo')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ riskHold: true, riskReason: $('#holdReason').value.trim() }) });
      render();
    }, 'On hold'));

    $('#releaseGo')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ riskHold: false }) });
      render();
    }, 'Hold released'));

    $('#blockEmailOrder')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const email = $('#email').value.trim();
      if (!confirm(`Block ${email} from new checkouts?`)) return;
      await api('/api/admin/risk', { method: 'POST', body: JSON.stringify({ action: 'block_email', email, reason: $('#holdReason').value.trim() || 'Blocked by ops' }) });
      render();
    }, 'Email blocked'));

    $('#blockGo')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const email = $('#riskEmail').value.trim();
      if (!email) { VS.toast('Enter an email', 'error'); return; }
      await api('/api/admin/risk', { method: 'POST', body: JSON.stringify({ action: 'block_email', email, reason: $('#riskReason').value.trim() }) });
      render();
    }, 'Email blocked'));

    $$('[data-unblock]').forEach(btn => btn.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/risk', { method: 'POST', body: JSON.stringify({ action: 'unblock_email', email: btn.dataset.unblock }) });
      render();
    }, 'Unblocked')));

    $('#blockEmail')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/risk', { method: 'POST', body: JSON.stringify({ action: 'block_email', email: id, reason: $('#blockReason').value.trim() }) });
      render();
    }, 'Email blocked'));

    $('#unblockEmail')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/risk', { method: 'POST', body: JSON.stringify({ action: 'unblock_email', email: id }) });
      render();
    }, 'Unblocked'));

    $('#saveOrder')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({
        email: $('#email').value.trim(),
        firstName: $('#firstName').value.trim(),
        phone: $('#phone').value.trim(),
        deliveryMethod: $('#shipMethod').value,
        dealerId: $('#dealerId').value || null,
        notes: $('#custNotes').value.trim(),
        shipping: readAddr('s'),
        billing: readAddr('b'),
      }) });
      render();
    }, 'Order updated'));

    $('#saveLines')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const items = collectLines();
      if (!items.length) { VS.toast('Add at least one line', 'error'); return; }
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ items }) });
      render();
    }, 'Lines re-quoted'));

    $('#addLine')?.addEventListener('click', () => {
      const sku = ($('#addSku').value || '').trim();
      const qty = Math.max(1, parseInt($('#addQty').value, 10) || 1);
      if (!sku) return;
      const tb = $('#lines');
      tb.insertAdjacentHTML('beforeend', `<tr>
        <td class="mono">${esc(sku)}</td><td>${esc(sku)}<span class="sub">priced on save</span></td>
        <td class="num"><input class="control" data-qty="${esc(sku)}" value="${qty}" inputmode="numeric" style="width:72px;text-align:right;height:34px"></td>
        <td class="num">—</td><td class="num">—</td>
        <td class="num"><button type="button" class="btn btn--ghost btn--sm" data-rm="${esc(sku)}">Remove</button></td>
      </tr>`);
      $('#addSku').value = '';
      tb.querySelector(`[data-rm="${CSS.escape(sku)}"]`)?.addEventListener('click', e => e.currentTarget.closest('tr').remove());
    });
    $$('[data-rm]').forEach(btn => btn.addEventListener('click', () => btn.closest('tr').remove()));

    $('#ffGo')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ fulfillment: $('#ff').value }) });
      render();
    }, 'Fulfillment updated'));

    $('#noteGo')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const note = $('#note').value.trim(); if (!note) return;
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ note }) });
      render();
    }, 'Note saved'));

    $('#cancel')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      if (!confirm('Cancel this order? Payment is not refunded from this console.')) return;
      await api('/api/admin/orders/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ status: 'cancelled' }) });
      render();
    }, 'Order cancelled'));

    $('#resend')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/orders/' + encodeURIComponent(id) + '/resend', { method: 'POST', body: JSON.stringify({ kind: $('#resendKind').value, email: $('#resendTo').value.trim() }) });
    }, 'Mail queued'));

    $('#copyLink')?.addEventListener('click', async () => {
      try {
        const { order } = await api('/api/admin/orders/' + encodeURIComponent(id));
        await navigator.clipboard.writeText(order.statusHref);
        VS.toast('Status link copied');
      } catch { VS.toast('Could not copy link', 'error'); }
    });

    $('#pdf')?.addEventListener('click', async () => {
      const r = await fetch('/api/orders/' + encodeURIComponent(id) + '/invoice.pdf', { headers: VSSession.headers() });
      if (!r.ok) { VS.toast('Invoice unavailable', 'error'); return; }
      window.open(URL.createObjectURL(await r.blob()), '_blank');
    });

    $('#saveCrm')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      await api('/api/admin/customers/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({
        name: $('#crmName').value.trim(), phone: $('#crmPhone').value.trim(), note: $('#crmNote').value.trim(),
        erpUserId: $('#crmErpUser').value.trim(),
      }) });
      render();
    }, 'Customer saved'));

    $('#createSku')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const cad = Number($('#price').value);
      const { product } = await api('/api/admin/products', { method: 'POST', body: JSON.stringify({
        sku: $('#sku').value.trim(), name: $('#name').value.trim(), variant: $('#variant').value.trim(),
        category: $('#category').value.trim(), img: $('#img').value.trim(), unitCents: Math.round(cad * 100),
      }) });
      go('products/' + encodeURIComponent(product.sku));
    }, 'SKU created'));

    $('#saveSku')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const cad = Number($('#price').value);
      await api('/api/admin/products/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({
        name: $('#name').value.trim(), variant: $('#variant').value.trim(), category: $('#category').value.trim(),
        img: $('#img').value.trim(), unitCents: Math.round(cad * 100), disabled: $('#disabled').checked,
      }) });
      render();
    }, 'Product saved'));

    $('#revertSku')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const out = await api('/api/admin/products/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ revert: true }) });
      if (out.product && out.product.removed) go('products');
      else render();
    }, 'Reverted'));

    $('#createDealer')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const body = readDealer();
      const { dealer } = await api('/api/admin/dealers', { method: 'POST', body: JSON.stringify(body) });
      go('dealers/' + encodeURIComponent(dealer.id));
    }, 'Dealer created'));

    $('#saveDealer')?.addEventListener('click', ev => run(ev.currentTarget, async () => {
      const body = readDealer();
      delete body.id;
      await api('/api/admin/dealers/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify(body) });
      render();
    }, 'Dealer saved'));
  }

  window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });
  render();
})();
</script>
</body>
</html>
