<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify your email · VANSTRO</title><link rel="stylesheet" href="/account/assets/vi.css"></head>
<body><main style="max-width:560px;margin:12vh auto;padding:32px;text-align:center;font-family:system-ui"><p style="margin:0 0 24px"><a class="js-home" href="/" aria-label="Vanstro home"><img src="/account/assets/brand/logo-navy.png" alt="VANSTRO" width="160" height="32" style="display:inline-block"></a></p><p style="margin:0 0 24px"><a class="auth__back" href="/">Back to vanstro.ca</a></p><h1>Verify your email</h1><p id="status">Checking your verification link…</p><a class="js-account" id="continue" href="/account" hidden>Continue to your account</a></main>
<script src="/account/assets/session.js"></script>
<script>
(async function () {
  const status = document.getElementById('status'); const link = document.getElementById('continue');
  const fr = /^\/fr(\/|$)/.test(location.pathname);
  if (fr) {
    document.documentElement.lang = 'fr-CA';
    document.title = 'Vérifier votre courriel · VANSTRO';
    document.querySelector('h1').textContent = 'Vérifier votre courriel';
    status.textContent = 'Vérification du lien…';
    link.textContent = 'Continuer vers votre compte';
  }
  if (window.VSSession && typeof VSSession.applyAuthHrefs === 'function') VSSession.applyAuthHrefs(fr);
  const token = new URLSearchParams(location.search).get('token');
  if (!token) { status.textContent = fr ? 'Ce lien de vérification est manquant ou invalide.' : 'This verification link is missing or invalid.'; return; }
  try {
    const res = await fetch('/api/auth/verify-email', { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { status.textContent = body.error === 'token_expired' ? 'This verification link has expired.' : 'This verification link is invalid or has already been used.'; return; }
    status.textContent = 'Your email is verified. Your account is ready.'; link.hidden = false;
    history.replaceState(null, '', '/verify-email');
  } catch { status.textContent = 'The account service is temporarily unavailable. Please try again.'; }
})();
</script></body></html>
