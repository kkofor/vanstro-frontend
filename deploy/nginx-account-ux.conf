# account-ux location fragment; include inside the www.vanstro.ca server block
#
# This is a location-only fragment. Paste/include it INSIDE the existing
# www.vanstro.ca server block. That server owns the canonical static site root
# and /api/v1 (Website API); this fragment must not replace or shadow either one.
# Do not include this in an apex redirect-only server.
#
# No bare `location /api` is permitted here. The account-ux service is the
# loopback upstream at 127.0.0.1:8792.

# Canonical payment URL; both spellings are accepted locally.
location = /checkout/payment {
    return 301 /checkout;
}
location = /checkout/payment/ {
    return 301 /checkout;
}
location = /fr/checkout/payment {
    return 301 /fr/checkout;
}
location = /fr/checkout/payment/ {
    return 301 /fr/checkout;
}

# Production static-asset fallback: serve the main site's own /assets first,
# then fall back to the account-ux files under /ux. The local Next process
# cannot express try_files, so next.config.mjs uses an explicit safe whitelist.
# Never proxy this whole prefix to 8792: /assets/products and
# /assets/vanstro-logo.png belong to the main storefront.
location ^~ /assets/ {
    # Last argument must be a URI (internal redirect to ^~ /ux/), not =404.
    # =404 as last would treat /ux$uri as a file under the static root and 404.
    try_files $uri /ux$uri;
}

# Exact .html file paths are included because checkout.html uses a relative
# location.replace('cart.html') for an empty cart. Keep these exact: never widen
# /products.html into a products slug rule.
location = /cart.html {
    proxy_pass http://127.0.0.1:8792/cart.html;
    proxy_http_version 1.1;
    proxy_set_header Host www.vanstro.ca;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /checkout.html {
