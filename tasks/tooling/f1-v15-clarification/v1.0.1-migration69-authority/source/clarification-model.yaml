      "id": "function.p02_resolve_persisted_authority_v3",
      "name": "p02_resolve_persisted_authority_v3",
      "identitySignature": "public.p02_resolve_persisted_authority_v3(text,text,text,text,text,text,bigint)",
      "owner": "vanstro_p02_guard_owner",
      "callers": [
        "vanstro_p08_guard_owner",
        "vanstro_p09_guard_owner",
        "vanstro_p10_guard_owner",
        "vanstro_p04_guard_owner"
      ],
      "securityDefiner": true,
      "searchPath": "pg_catalog, public",
      "requires": [
        "f1_p02_resolver_registry",
        "refresh_sessions",
        "users",
        "roles",
        "permissions",
        "fixed resource tables"
      ],
      "canonicalSql": "CREATE OR REPLACE FUNCTION public.p02_resolve_persisted_authority_v3(session_token_hash text,resource_type text,resource_id text,operation_key text,required_permission text,expected_context_revision text,expected_target_revision bigint) RETURNS TABLE(outcome text,reason text,actor_id text,scope_kind text,dealer_ids text[],location_ids text[],resource_revision bigint,resolver_id text,grant_provenance jsonb) LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path=pg_catalog,public AS $fn$ DECLARE reg public.f1_p02_resolver_registry%ROWTYPE;uid text;target_scope text;target_dealers text[];target_locations text[];target_context text;target_revision bigint;provenance jsonb;has_global boolean;BEGIN SELECT * INTO reg FROM public.f1_p02_resolver_registry WHERE \"resourceType\"=resource_type AND \"operationKey\"=operation_key AND \"permissionKey\"=required_permission;IF NOT FOUND THEN RETURN QUERY SELECT 'denied','unknown_tuple',NULL::text,NULL::text,NULL::text[],NULL::text[],NULL::bigint,NULL::text,NULL::jsonb;RETURN;END IF;SELECT s.\"userId\" INTO uid FROM public.refresh_sessions s JOIN public.users u ON u.id=s.\"userId\" WHERE s.\"tokenHash\"=session_token_hash AND s.\"revokedAt\" IS NULL AND s.\"expiresAt\">CURRENT_TIMESTAMP AND u.status='active' AND u.kind='admin';IF uid IS NULL THEN RETURN QUERY SELECT 'denied','session_denied',NULL::text,NULL::text,NULL::text[],NULL::text[],NULL::bigint,reg.\"resolverId\",NULL::jsonb;RETURN;END IF;CASE resource_type WHEN 'p08_import' THEN SELECT \"authorizationScopeKind\",\"dealerIdsSnapshot\",\"locationIdsSnapshot\",\"contextRevision\",version::bigint INTO target_scope,target_dealers,target_locations,target_context,target_revision FROM public.dashboard_import_batch WHERE id::text=resource_id;WHEN 'p08_export' THEN SELECT \"authorizationScopeKind\",\"dealerIdsSnapshot\",\"locationIdsSnapshot\",\"contextRevision\",version::bigint INTO target_scope,target_dealers,target_locations,target_context,target_revision FROM public.dashboard_export_request WHERE id::text=resource_id;WHEN 'p09_config' THEN SELECT \"authorizationScopeKind\",\"dealerIdsSnapshot\",\"locationIdsSnapshot\",\"contextRevision\",generation INTO target_scope,target_dealers,target_locations,target_context,target_revision FROM public.runtime_config_version WHERE id::text=resource_id;WHEN 'p09_flag' THEN SELECT \"authorizationScopeKind\",\"dealerIdsSnapshot\",\"locationIdsSnapshot\",\"contextRevision\",generation INTO target_scope,target_dealers,target_locations,target_context,target_revision FROM public.feature_flag_version WHERE id::text=resource_id;WHEN 'p10_analytics_ingestion' THEN SELECT \"authorizationScopeKind\",\"dealerIdsSnapshot\",\"locationIdsSnapshot\",\"contextRevision\",version::bigint INTO target_scope,target_dealers,target_locations,target_context,target_revision FROM public.foundation_sample WHERE id::text=resource_id;ELSE target_scope:='global';target_dealers:=ARRAY[]::text[];target_locations:=ARRAY[]::text[];target_context:=expected_context_revision;target_revision:=expected_target_revision;END CASE;IF target_scope IS NULL THEN RETURN QUERY SELECT 'not_found','resource_not_found',uid,NULL::text,NULL::text[],NULL::text[],NULL::bigint,reg.\"resolverId\",NULL::jsonb;RETURN;END IF;WITH direct_grants AS (SELECT 'direct_user_role' source_kind,ur.id user_role_id,NULL::text membership_id,NULL::integer membership_revision,r.id role_id,r.key role_key,rp.id role_permission_id,p.id permission_id,p.key permission_key,NULL::text dealer_id,NULL::text location_id FROM public.user_roles ur JOIN public.roles r ON r.id=ur.\"roleId\" JOIN public.role_permissions rp ON rp.\"roleId\"=r.id JOIN public.permissions p ON p.id=rp.\"permissionId\" WHERE ur.\"userId\"=uid AND p.key=required_permission AND r.key<>'dealer_admin'),membership_grants AS (SELECT 'dealer_membership_role',NULL::text,m.id,m.revision,r.id,r.key,rp.id,p.id,p.key,m.\"dealerId\",dl.id FROM public.dealer_memberships m JOIN public.dealers d ON d.id=m.\"dealerId\" AND d.status='active' JOIN public.dealer_membership_roles mr ON mr.\"membershipId\"=m.id JOIN public.roles r ON r.id=mr.\"roleId\" JOIN public.role_permissions rp ON rp.\"roleId\"=r.id JOIN public.permissions p ON p.id=rp.\"permissionId\" AND p.key=required_permission LEFT JOIN public.dealer_membership_locations ml ON ml.\"membershipId\"=m.id AND ml.\"dealerId\"=m.\"dealerId\" LEFT JOIN public.dealer_locations dl ON dl.id=ml.\"dealerLocationId\" AND dl.\"dealerId\"=ml.\"dealerId\" AND dl.status='active' WHERE m.\"userId\"=uid AND m.status='active' AND m.\"revokedAt\" IS NULL AND m.\"validFrom\"<=CURRENT_TIMESTAMP AND (m.\"expiresAt\" IS NULL OR m.\"expiresAt\">CURRENT_TIMESTAMP) AND r.key='dealer_admin'),g AS (SELECT * FROM direct_grants UNION ALL SELECT * FROM membership_grants) SELECT EXISTS(SELECT 1 FROM g WHERE source_kind='direct_user_role'),COALESCE(jsonb_agg(to_jsonb(g) ORDER BY source_kind,membership_id,user_role_id,role_id,dealer_id,location_id),'[]'::jsonb) INTO has_global,provenance FROM g;IF provenance='[]'::jsonb THEN RETURN QUERY SELECT 'denied','permission_denied',uid,NULL::text,NULL::text[],NULL::text[],target_revision,reg.\"resolverId\",provenance;RETURN;END IF;IF NOT has_global AND ((target_scope='global') OR (target_scope='dealer' AND EXISTS(SELECT 1 FROM unnest(target_dealers) d WHERE NOT EXISTS(SELECT 1 FROM jsonb_to_recordset(provenance) x(source_kind text,dealer_id text,location_id text) WHERE x.dealer_id=d))) OR (target_scope='location' AND EXISTS(SELECT 1 FROM public.dealer_locations dl WHERE dl.id=ANY(target_locations) AND dl.\"dealerId\"=ANY(target_dealers) AND NOT EXISTS(SELECT 1 FROM jsonb_to_recordset(provenance) x(source_kind text,dealer_id text,location_id text) WHERE x.dealer_id=dl.\"dealerId\" AND (x.location_id IS NULL OR x.location_id=dl.id))))) THEN RETURN QUERY SELECT 'denied','scope_denied',uid,target_scope,target_dealers,target_locations,target_revision,reg.\"resolverId\",provenance;RETURN;END IF;IF expected_context_revision IS NULL OR expected_target_revision IS NULL OR target_context IS DISTINCT FROM expected_context_revision OR target_revision IS DISTINCT FROM expected_target_revision THEN RETURN QUERY SELECT 'stale','context_or_target_revision_changed',uid,target_scope,target_dealers,target_locations,target_revision,reg.\"resolverId\",provenance;RETURN;END IF;RETURN QUERY SELECT 'authorized','authorized',uid,target_scope,target_dealers,target_locations,target_revision,reg.\"resolverId\",provenance;END $fn$;\n",
      "canonicalSqlSha256": "b0d1b7ad87f201522f330e68d9333f0a18014436ace079f09d9004b00d150ea0",
      "reason": "implementation_audit_missing_authority"
    },
