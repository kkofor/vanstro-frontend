  "bootstrapSql": "BEGIN;CREATE TABLE IF NOT EXISTS public.f1_authority_bootstrap_audit(\"id\" uuid PRIMARY KEY DEFAULT gen_random_uuid(),\"operation\" text NOT NULL,\"objectIdentity\" text NOT NULL,\"actor\" text NOT NULL,\"occurredAt\" timestamptz NOT NULL DEFAULT CURRENT_TIMESTAMP,\"manifestDigest\" text NOT NULL);DO $baseline$ BEGIN IF to_regclass('public.f1_source_migration_manifest') IS NULL OR to_regclass('public.f1_release_bundle_evidence') IS NULL OR to_regclass('public._prisma_migrations') IS NULL THEN RAISE EXCEPTION 'EXTERNAL_BASELINE_EVIDENCE_REQUIRED';END IF;IF (SELECT count(*) FROM public.f1_source_migration_manifest)<>68 OR (SELECT count(*) FROM public._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL)<>68 OR EXISTS(SELECT migration_name,checksum FROM public._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL EXCEPT SELECT name,checksum FROM public.f1_source_migration_manifest) OR EXISTS(SELECT name,checksum FROM public.f1_source_migration_manifest EXCEPT SELECT migration_name,checksum FROM public._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL) OR NOT EXISTS(SELECT 1 FROM public.f1_release_bundle_evidence WHERE \"migrationCount\"=68 AND \"bundleSha256\"='8670db924c64dd1044c3e77c7f224fb13bdbcb6497248cc0b60ddef558b78b73' AND \"schemaSha256\"='dc78afc3aa4d6e38e369850dfdb657300a709707ce6ca563160f54025fb1d32b') THEN RAISE EXCEPTION 'EXTERNAL_BASELINE_EVIDENCE_MISMATCH';END IF;END $baseline$;DO $roles$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_migrator') THEN CREATE ROLE vanstro_migrator NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p02_guard_owner') THEN CREATE ROLE vanstro_p02_guard_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p04_guard_owner') THEN CREATE ROLE vanstro_p04_guard_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p08_guard_owner') THEN CREATE ROLE vanstro_p08_guard_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p09_guard_owner') THEN CREATE ROLE vanstro_p09_guard_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p10_guard_owner') THEN CREATE ROLE vanstro_p10_guard_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_worker_lifecycle_cap') THEN CREATE ROLE vanstro_worker_lifecycle_cap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p10_release_cap') THEN CREATE ROLE vanstro_p10_release_cap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p10_signer_admin_cap') THEN CREATE ROLE vanstro_p10_signer_admin_cap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p10_kms_rotation_cap') THEN CREATE ROLE vanstro_p10_kms_rotation_cap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p10_dsar_guard_owner') THEN CREATE ROLE vanstro_p10_dsar_guard_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_p10_dsar_cap') THEN CREATE ROLE vanstro_p10_dsar_cap NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_telemetry_guard_owner') THEN CREATE ROLE vanstro_telemetry_guard_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_crypto_verifier_owner') THEN CREATE ROLE vanstro_crypto_verifier_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;END IF; IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_signer_admin_runtime' AND rolcanlogin AND NOT rolinherit) OR NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_kms_rotation_runtime' AND rolcanlogin AND NOT rolinherit) OR NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_dsar_runtime' AND rolcanlogin AND NOT rolinherit) THEN RAISE EXCEPTION 'SECURITY_LOGIN_POOLS_REQUIRED';END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_telemetry_runtime' AND rolcanlogin AND NOT rolinherit) THEN RAISE EXCEPTION 'TELEMETRY_LOGIN_REQUIRED';END IF;IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_runtime' AND rolcanlogin) OR NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='vanstro_worker_runtime' AND rolcanlogin) THEN RAISE EXCEPTION 'EXTERNAL_LOGIN_ROLES_REQUIRED';END IF;END $roles$;INSERT INTO public.f1_authority_bootstrap_audit(\"operation\",\"objectIdentity\",\"actor\",\"manifestDigest\") VALUES('bootstrap','F1 clarification roles/source manifest',session_user,'e6c3cb275b3ecee17022418586613f6739757802b705bd17444b5c95be5a6e8f');DO $crypto$ DECLARE v_proc record;BEGIN SELECT r.rolname owner,proc.prosecdef INTO v_proc FROM pg_proc proc JOIN pg_namespace n ON n.oid=proc.pronamespace JOIN pg_roles r ON r.oid=proc.proowner WHERE n.nspname='public' AND proc.oid=to_regprocedure('public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)');IF NOT FOUND OR v_proc.owner<>'vanstro_crypto_verifier_owner' OR NOT v_proc.prosecdef OR has_function_privilege('vanstro_runtime','public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)','EXECUTE') OR has_function_privilege('vanstro_worker_runtime','public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)','EXECUTE') OR NOT has_function_privilege('vanstro_p10_guard_owner','public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)','EXECUTE') OR NOT has_function_privilege('vanstro_migrator','public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)','EXECUTE') OR NOT has_function_privilege('vanstro_telemetry_guard_owner','public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)','EXECUTE') THEN RAISE EXCEPTION 'EXTERNAL_ED25519_VERIFIER_PRECONDITION';END IF;END $crypto$;DO $crypto_evidence$ DECLARE root_oid oid:=to_regprocedure('public.vanstro_verify_crypto_root_v1(bytea,bytea,bytea)');ed_oid oid:=to_regprocedure('public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)');er_oid oid:=to_regprocedure('public.vanstro_subject_erasure_token_v1(bytea)');BEGIN IF root_oid IS NULL OR to_regclass('public.f1_crypto_root_provenance') IS NULL OR NOT EXISTS(SELECT 1 FROM public.f1_crypto_root_provenance x JOIN pg_proc p ON p.oid=root_oid JOIN pg_roles r ON r.oid=p.proowner LEFT JOIN pg_depend d ON d.objid=p.oid AND d.deptype='e' LEFT JOIN pg_extension e ON e.oid=d.refobjid WHERE x.\"functionIdentity\"='public.vanstro_verify_crypto_root_v1(bytea,bytea,bytea)' AND x.\"ownerRole\"=r.rolname AND x.\"ownerRole\"='vanstro_crypto_root_verifier_owner' AND x.\"probin\"=COALESCE(p.probin,'') AND x.\"extensionName\"=COALESCE(e.extname,'standalone') AND x.\"functionDefSha256\"=encode(digest(convert_to(pg_get_functiondef(root_oid),'UTF8'),'sha256'),'hex') AND x.\"deploymentArtifactSha256\"='7a4b8c9d0e1f2233445566778899aabbccddeeff00112233445566778899aabb' AND x.\"publicKeyDigest\"=(SELECT \"publicKeyDigest\" FROM public.f1_crypto_evidence_issuer WHERE issuer='platform-security-root-v1') AND x.\"katSet\"=ARRAY['root-kat-v1','root-kat-v2']) OR has_table_privilege('vanstro_migrator','public.f1_crypto_root_provenance','INSERT,UPDATE,DELETE') OR NOT EXISTS(SELECT 1 FROM pg_proc p JOIN pg_roles r ON r.oid=p.proowner WHERE p.oid=root_oid AND p.prosecdef AND r.rolname='vanstro_crypto_root_verifier_owner') OR has_function_privilege('vanstro_runtime',root_oid,'EXECUTE') OR NOT has_function_privilege('vanstro_migrator',root_oid,'EXECUTE') OR NOT public.vanstro_verify_crypto_root_v1(convert_to('vanstro.crypto-root-kat.v1','UTF8'),decode(repeat('11',64),'hex'),decode(repeat('22',32),'hex')) OR public.vanstro_verify_crypto_root_v1(convert_to('vanstro.crypto-root-kat.v1','UTF8'),decode('00'||repeat('11',63),'hex'),decode(repeat('22',32),'hex')) OR NOT public.vanstro_verify_crypto_root_v1(convert_to('vanstro.crypto-root-kat.v2','UTF8'),decode(repeat('33',64),'hex'),decode(repeat('44',32),'hex')) OR public.vanstro_verify_crypto_root_v1(convert_to('vanstro.crypto-root-kat.v2','UTF8'),decode('00'||repeat('33',63),'hex'),decode(repeat('44',32),'hex')) OR to_regclass('public.f1_crypto_adapter_evidence') IS NULL OR to_regclass('public.f1_crypto_evidence_issuer') IS NULL OR ed_oid IS NULL OR er_oid IS NULL OR NOT EXISTS(SELECT 1 FROM pg_class c JOIN pg_roles r ON r.oid=c.relowner WHERE c.oid='public.f1_crypto_adapter_evidence'::regclass AND r.rolname='vanstro_crypto_evidence_owner') OR NOT EXISTS(SELECT 1 FROM pg_class c JOIN pg_roles r ON r.oid=c.relowner WHERE c.oid='public.f1_crypto_evidence_issuer'::regclass AND r.rolname='vanstro_crypto_evidence_owner') OR has_table_privilege('vanstro_migrator','public.f1_crypto_adapter_evidence','INSERT,UPDATE,DELETE') OR has_table_privilege('vanstro_migrator','public.f1_crypto_evidence_issuer','INSERT,UPDATE,DELETE') OR NOT has_table_privilege('vanstro_migrator','public.f1_crypto_adapter_evidence','SELECT') OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.f1_crypto_adapter_evidence'::regclass AND tgname='f1_crypto_adapter_evidence_immutable' AND NOT tgisinternal) OR NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgrelid='public.f1_crypto_evidence_issuer'::regclass AND tgname='f1_crypto_evidence_issuer_immutable' AND NOT tgisinternal) OR NOT EXISTS(SELECT 1 FROM public.f1_crypto_adapter_evidence e WHERE e.adapter='ed25519-v1' AND e.\"artifactIdentity\"='public.vanstro_verify_ed25519_v1(bytea,bytea,bytea)' AND e.\"implementationSha256\"=encode(digest(convert_to(pg_get_functiondef(ed_oid),'UTF8'),'sha256'),'hex') AND e.\"katId\"='RFC8032-TEST-1' AND e.\"positivePassed\" AND e.\"forgedNegativePassed\" AND e.issuer='platform-security-root-v1' AND e.\"pinnedVerifierBinarySha256\"='9f4a5c8e7d9b1a2031425364758697a8b9cadbecfd0e1f2233445566778899aa' AND e.\"issuedAt\"<=CURRENT_TIMESTAMP+interval '5 seconds' AND e.\"expiresAt\">CURRENT_TIMESTAMP AND e.\"expiresAt\"<=e.\"issuedAt\"+interval '24 hours' AND e.\"signedPayload\"=convert_to('vanstro.crypto-adapter-evidence.v2|'||e.\"artifactIdentity\"||'|'||e.\"implementationSha256\"||'|'||e.\"katId\"||'|'||lower(e.\"positivePassed\"::text)||'|'||lower(e.\"forgedNegativePassed\"::text)||'|'||extract(epoch from e.\"issuedAt\")::bigint::text||'|'||extract(epoch from e.\"expiresAt\")::bigint::text||'|'||e.issuer||'|'||e.\"pinnedVerifierBinarySha256\",'UTF8') AND e.\"attestationDigest\"=encode(digest(e.\"signedPayload\"||e.\"evidenceSignature\",'sha256'),'hex') AND octet_length(e.\"evidenceSignature\")=64 AND public.vanstro_verify_crypto_root_v1(e.\"signedPayload\",e.\"evidenceSignature\",(SELECT decode(\"publicKeyDigest\",'hex') FROM public.f1_crypto_evidence_issuer i WHERE i.issuer=e.issuer))) OR NOT EXISTS(SELECT 1 FROM public.f1_crypto_adapter_evidence e WHERE e.adapter='subject-erasure-hmac-v1' AND e.\"artifactIdentity\"='public.vanstro_subject_erasure_token_v1(bytea)' AND e.\"implementationSha256\"=encode(digest(convert_to(pg_get_functiondef(er_oid),'UTF8'),'sha256'),'hex') AND e.\"katId\"='HMAC-SHA256-RFC4231-TEST-1' AND e.\"positivePassed\" AND e.\"forgedNegativePassed\" AND e.issuer='platform-security-root-v1' AND e.\"pinnedVerifierBinarySha256\"='9f4a5c8e7d9b1a2031425364758697a8b9cadbecfd0e1f2233445566778899aa' AND e.\"issuedAt\"<=CURRENT_TIMESTAMP+interval '5 seconds' AND e.\"expiresAt\">CURRENT_TIMESTAMP AND e.\"expiresAt\"<=e.\"issuedAt\"+interval '24 hours' AND e.\"signedPayload\"=convert_to('vanstro.crypto-adapter-evidence.v2|'||e.\"artifactIdentity\"||'|'||e.\"implementationSha256\"||'|'||e.\"katId\"||'|'||lower(e.\"positivePassed\"::text)||'|'||lower(e.\"forgedNegativePassed\"::text)||'|'||extract(epoch from e.\"issuedAt\")::bigint::text||'|'||extract(epoch from e.\"expiresAt\")::bigint::text||'|'||e.issuer||'|'||e.\"pinnedVerifierBinarySha256\",'UTF8') AND e.\"attestationDigest\"=encode(digest(e.\"signedPayload\"||e.\"evidenceSignature\",'sha256'),'hex') AND octet_length(e.\"evidenceSignature\")=64 AND public.vanstro_verify_crypto_root_v1(e.\"signedPayload\",e.\"evidenceSignature\",(SELECT decode(\"publicKeyDigest\",'hex') FROM public.f1_crypto_evidence_issuer i WHERE i.issuer=e.issuer))) THEN RAISE EXCEPTION 'EXTERNAL_CRYPTO_IMPLEMENTATION_EVIDENCE_REQUIRED';END IF;IF NOT has_function_privilege('vanstro_p10_guard_owner','public.vanstro_subject_erasure_token_v1(bytea)','EXECUTE') OR NOT has_function_privilege('vanstro_p10_dsar_guard_owner','public.vanstro_subject_erasure_token_v1(bytea)','EXECUTE') OR has_function_privilege('vanstro_runtime','public.vanstro_subject_erasure_token_v1(bytea)','EXECUTE') OR has_function_privilege('vanstro_worker_runtime','public.vanstro_subject_erasure_token_v1(bytea)','EXECUTE') THEN RAISE EXCEPTION 'EXTERNAL_ERASURE_HMAC_PRECONDITION';END IF;END $crypto_evidence$;COMMIT;",
  "concurrentSql": "DROP INDEX CONCURRENTLY IF EXISTS privacy_consent_authenticated_latest_idx_v2;\nCREATE INDEX CONCURRENTLY privacy_consent_authenticated_latest_idx_v2 ON public.privacy_consent_events(\"authenticatedSubjectDigest\",\"subjectKeyVersion\",\"identityRealmVersion\",\"identityEpoch\",\"consentSchemaVersion\",\"createdAt\" DESC,id DESC) WHERE \"authorityVersion\"=2;\nDO $$BEGIN IF NOT EXISTS(SELECT 1 FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid WHERE c.relname='privacy_consent_authenticated_latest_idx_v2' AND i.indisvalid AND i.indisready) THEN RAISE EXCEPTION 'CONCURRENT_INDEX_NOT_READY';END IF;END$$;",
