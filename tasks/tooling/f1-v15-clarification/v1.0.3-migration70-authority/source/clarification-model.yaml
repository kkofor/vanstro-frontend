    "decision": "Functional-first M70 (F1): keep BEGIN/timeouts/serializable, consume, CONFIG_AUDIT_PRECHECK, the 3 authority2 audit-required constraints, the attestation consume check (without OLD_EXECUTE), and source_latest. Delete the legacy REVOKE ALL ON FUNCTION p08/p09/p10 blocks and the OLD_EXECUTE_REMAINS postasserts (the runner deploys as vanstro_migrator, which is not the owner of those guard-owned functions, so the A+ revokes are not executable and the functional gate does not require the A+ multi-role ACL closure). Resolver DROP/ADD constraint runs under SET LOCAL ROLE vanstro_p02_guard_owner + RESET ROLE (current_user returns to migrator); the two registry INSERTs run as migrator. The 3 v3 functions keep migrator ownership (no ALTER OWNER, no REVOKE) and receive GRANT EXECUTE to vanstro_runtime. Final postassert is limited to attestation, resolver rows, v3 SECURITY DEFINER/search_path, and runtime EXECUTE — no owner/grantor/grantable/public/worker/old-execute purification."
